[build]
  # Static site copied into _site, the publish directory the Netlify UI and
  # extensions still expect from the old Jekyll setup.
  command = "rm -rf _site && mkdir _site && cp index.html _site/"
  publish = "_site"

# Old Jekyll pages now live as sections of the single page.
[[redirects]]
  from = "/about/*"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/what-we-treat/*"
  to = "/#treat"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/#visit"
  status = 301
