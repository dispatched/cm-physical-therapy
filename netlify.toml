[build]
  # Plain static site: override the leftover `jekyll build` command set in the Netlify UI.
  command = "echo 'No build step: static site'"
  publish = "."

# Old Jekyll pages now live as sections of the single page.
[[redirects]]
  from = "/about/*"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/what-we-treat/*"
  to = "/#treat"
  status = 301

[[redirects]]
  from = "/contact/*"
  to = "/#visit"
  status = 301
